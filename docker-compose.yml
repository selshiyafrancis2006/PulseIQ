services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123d
      POSTGRES_DB: pulseiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  agent:
    build: ./agent
    environment:
      BACKEND_URL: http://backend:5000/api/agent/metrics
      API_KEY: ${AGENT_API_KEY:-}
      INTERVAL_MS: 5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: